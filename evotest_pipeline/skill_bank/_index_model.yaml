  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  - TYPE_CONVERSION
  - STATE_MUTATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0746
- name: custom-level-range-edge-mapping
  description: When a JUL-to-Log4j level converter uses a nearest-neighbor search
