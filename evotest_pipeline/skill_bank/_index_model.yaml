  code_tags:
  - URI_RESOURCE_PATH_DECODING
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0971
- name: alternative-protocol-decoding
  description: When a protocol decoder has multiple decoding paths (normal frame decoder
