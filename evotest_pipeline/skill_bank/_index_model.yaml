  code_tags:
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0732
- name: document-store-visibility-modcount-synchronization
  description: When testing concurrent updates to DocumentStore documents, tests must
    verify that _modCount strictly increases across visibility changes, and that synchronization
    on the document ID ensures correct ordering. Use this skill when validating atomic
    counter behavior under concurrent access.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  - STATE_MUTATION
  - CONCURRENCY
  test_pattern: STATE_TEST
  id: initial_skill_0733
- name: interface-default-method-selection-priority
  description: When selecting handler methods for bean invocation, default methods
    from interfaces should be preferred over concrete class methods when the interface
    is explicitly specified. This skill teaches the TG to test method selection order
    in bean proxy scenarios involving interface default methods.
  code_tags:
  - STATE_MUTATION
  - TYPE_CONVERSION
  test_pattern: INTERACTION_TEST
  id: initial_skill_0734
- name: annotation-parameter-index-shift-for-nested-types
  description: When processing method parameter annotations with ASM, the index passed
