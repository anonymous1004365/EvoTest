    - BUG_DETECTED
    transition_tags: []
    keywords:
    - catch
    - exception
    - swallow
    - printStackTrace
    - propagation
    - e.printStackTrace
  id: exception-swallowing-catch-block-detection
- name: fail-on-fixed-calibrate-assertions
  description: WHEN a generated suite fails on the fixed version (FAIL_ON_FIXED),
    the assertions are too strong or the setup violates the fixed API contract. Re-read
    fixed source and existing tests, reduce the assertions to fixed-valid behavior,
    and remove scenarios unsupported by the fixed code.
  code_tags:
  - TIER_RECOVERY
  - FAIL_ON_FIXED
  test_pattern: STATE_TEST
  evolution:
    active: true
    priority: 0
    evidence:
      added: 1
  retrieval:
    applicable_tiers:
    - FAIL_ON_FIXED
    transition_tags: []
    keywords:
    - fail_on_fixed
    - calibrate
    - fixed behavior
    - assertion too strong
    - repair
  id: fail-on-fixed-calibrate-assertions
- name: fixed-view-pass-both-retry-diversification
  description: WHEN a generated retry suite passes on both fixed and buggy versions,
    use only fixed-version evidence to try a different behavior class instead of varying
    the same happy path.
  code_tags:
  - PASS_BOTH_RECOVERY_FIXED_VIEW
