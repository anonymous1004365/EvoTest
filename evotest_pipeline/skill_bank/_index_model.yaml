  - BOUNDARY_CHECK
  - ARRAY_INDEX_ACCESS
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0548
- name: stream-iteration-watermark-propagation
  description: When a StreamIterationHead operator forwards watermarks, it must not
    mutate the original watermark object since the downstream head operator already
    emitted it. Use this skill to test watermark emission after iteration in streaming
    dataflows.
  code_tags:
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0549
- name: throttler-jmx-state-synchronization
  description: When a Throttler's maximum requests per period is changed programmatically,
    the getCurrentMaximumRequestsPerPeriod() JMX method may not reflect the latest
    update due to asynchronous state handling. The TG should test that JMX-exposed
    state remains consistent after dynamic updates.
  code_tags:
  - STATE_MUTATION
  - CONCURRENCY
  test_pattern: STATE_TEST
  id: initial_skill_0550
- id: initial_skill_0551
  name: initial_skill_0551
- name: null-signature-handling-for-unbound-type-variables
  description: When type signatures are computed for unbound or unresolved type parameters,
    the signature method may return null. Tests must cover this case to prevent NullPointerException
    in downstream operations like string concatenation or equals comparisons.
  code_tags:
  - NULL_CHECK
  - TYPE_CONVERSION
  - VALIDATION
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0552
- name: cast-type-annotation-preservation
  description: When tests involve casting expressions with type annotations, verify
    that the target type is preserved correctly after serialization/deserialization.
    This skill applies when code manipulates cast expressions and their types.
  code_tags:
  - VALIDATION
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  - TYPE_CONVERSION
  test_pattern: STATE_TEST
  id: initial_skill_0553
- name: serializable-ctstatement-field-capture
  description: When testing serialization of AST elements (like CtStatement), verify
    that all fields including inherited and undocumented ones are properly captured
    during serialization/deserialization. This skill helps catch bugs where field
    values are lost due to incomplete serialization handling.
  code_tags:
  - SERIALIZATION
  - STATE_MUTATION
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0554
- name: snippet-template-parameter-validation
  description: When creating snippet tests that involve template parameter resolution
