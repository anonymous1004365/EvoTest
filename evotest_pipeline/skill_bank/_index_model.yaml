  - STATE_MUTATION
  - ARGUMENT_VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0723
- name: date-field-treatment-mismatch
  description: When components or converters directly read Date fields (year/month/day)
    from a java.util.Date object using deprecated getYear()/getMonth()/getDate(),
    test that passing Dates created from a java.util.Calendar (which correctly treats
    month 0=January) produces the same result as passing Dates created from year-month-day
    constructors (which may have different offset behavior). The bug causes date field
    extraction to be off by one in the year/month/day when the Date was built from
    a Calendar.
