  - TYPE_CONVERSION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0726
- name: unmodified-builder-state-equals-base
  description: When obtaining a child NodeBuilder from the parent via `child()` or
    `getChildNode()` and making zero modifications to it or its subtree, `getNodeState()`
