    the correct status.
  code_tags:
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0871
- name: windows-path-isabsolute-validation
  description: WHEN testing path.isAbsolute() with Windows-style paths (e.g., "C:"
    without trailing slash), THEN verify the method correctly identifies them as relative,
    not absolute. This applies to any Path class that supports Windows drive letter
    notation.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - STATE_MODIFICATION
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0872
- name: string-cutleadingonprefix-edge-cases
  description: Tests for the Strings.cutLeadingOnPrefix method should verify behavior
    when the input string does not start with the prefix, and should return the original
    string unchanged in that case.
  code_tags:
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0873
- name: raw-type-function-type-extraction
  description: When extracting types from Java generic methods that accept raw (non-parameterized)
    functional interface types, test that the type extractor throws an IllegalArgumentException
    instead of failing with an internal error or returning incorrect results.
  code_tags:
  - TYPE_CONVERSION
  - VALIDATION
  - EXCEPTION_HANDLING
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0874
- name: json-escape-double-quote-handling
  description: When generating JSON output, strings containing double quotes (") must
