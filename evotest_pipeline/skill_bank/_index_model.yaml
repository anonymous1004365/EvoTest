  - VALIDATION
  - NULL_CHECK
  - BOUNDARY_CHECK
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0766
- name: throwable-proxy-class-loading-failure
  description: When constructing ThrowableProxy for a Throwable whose stack trace
