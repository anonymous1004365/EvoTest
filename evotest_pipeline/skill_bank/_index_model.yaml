  code_tags:
  - BUILDER_PATTERN
  - VALIDATION
  - STATE_MUTATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0587
- name: creator-registration-guard-verification
  description: WHEN registering constructors/factory methods as JSON creators (delegating,
    property-based, array-delegating), THEN test that when a creator is rejected by
    verifyNonDup (e.g., a more specific creator already exists), its associated injectables/properties
    are NOT registered, preventing silent overwrite of the correct creator's configuration.
  code_tags:
  - TYPE_CONVERSION
  - NULL_CHECK
  - VALIDATION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0588
- name: clone-declaration-binding
  description: When a reference is cloned, its internal declaration binding may be
    lost or detached. Tests should verify that cloned references still resolve to
    the correct original declaration.
  code_tags:
  - ARGUMENT_VALIDATION
  - ARRAY_INDEX_ACCESS
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0589
