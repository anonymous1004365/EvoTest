  - NULL_CHECK
  - NULL_CHECK_PARENT_FILE
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1044
- name: package-mapper-indexed-parameter-count
  description: WHEN testing PackageMapper.parseRequest for hybrid URLs (page class
