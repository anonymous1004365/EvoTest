  code_tags:
  - CONCURRENCY
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0977
- name: inline-enclosure-wicket-message-rendering
  description: WHEN an InlineEnclosure component has a child component with a wicket:message
