  - VALIDATION
  - TYPE_CONVERSION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0968
- name: marker-hasparents-null-safety
  description: When testing methods like hasParents() on a Marker with added then
    removed parents, the test must verify that hasParents() correctly returns false
