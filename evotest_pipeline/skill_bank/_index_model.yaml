    by combining sub-privilege names/bits (e.g., jcr:write combining jcr:modifyProperties,
    rep:addProperties, etc.), THEN the TG should test that the declared aggregate
    privileges are returned in the correct canonical order, not in the arbitrary registration
    order. This skill addresses the common pitfall where aggregate privilege definitions
    store sub-privileges in insertion order (which may be alphabetical or user-specified)
    but the contract expects a specific canonical ordering.
  code_tags:
  - PRIVILEGE_AGGREGATE_BUILDING
  test_pattern: STATE_TEST
  id: initial_skill_0836
- name: uri-parameter-duplicate-preservation
  description: When normalizing URIs with duplicate query parameters, the normalized
    output must preserve all duplicate values. The TG should test URI normalization
    functions with duplicate parameter keys to ensure values are not lost during normalization.
  code_tags:
  - ARGUMENT_VALIDATION
  - NULL_CHECK
  - STATE_MUTATION
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0837
- name: advicewith-on-exception-route-mutation
  description: When using adviceWith to modify routes that contain onException clauses,
    tests must ensure the weaving process correctly handles exception handlers. This
    skill helps detect bugs where onException handlers are lost or improperly matched
    after adviceWith operations.
  code_tags:
  - NULL_CHECK
  - VALIDATION
  - STATE_MUTATION
  test_pattern: INTERACTION_TEST
  id: initial_skill_0838
- name: proxy-exception-unwrapping
  description: When testing code that uses java.lang.reflect.Proxy-based wrappers
    (like tracing or monitoring proxies), the TG must verify that original exceptions
    are propagated through InvocationTargetException unwrapping, not wrapped in it.
    This skill teaches how to test that checked exceptions thrown by proxied methods
    are correctly re-thrown as their original type.
  code_tags:
  - EXCEPTION_HANDLING
  - ORDER_DEPENDENCY
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0839
- name: document-split-commit-root-path
  description: When tests involve document splitting with commit roots, the test must
    verify that getCommitRootPath resolves paths correctly for split document entries
    referencing the previous document. Without this check, splitting can produce invalid
    commit root paths.
  code_tags:
  - STATE_MUTATION
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0840
- name: serialization-clone-exception-handling
  description: When cloning objects via serialization, always test with objects whose
    fields reference non-serializable classes and verify that the cloneObject method
    throws a WicketRuntimeException wrapping the original exception, not a generic
    RuntimeException.
  code_tags:
  - VALIDATION
  - BOUNDARY_CHECK
  - SERIALIZATION_CLONE_BUG
  - EXCEPTION_HANDLING
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0841
- id: initial_skill_0842
  name: initial_skill_0842
- name: version-history-upgrade-order-dependency
  description: WHEN testing repository upgrade code that manages version histories
    or version storage nodes, THEN verify that version history entries are correctly
    preserved and ordered after the upgrade. This skill prevents bugs where version
    history node ordering is lost or altered during upgrade due to state mutation
    and order dependency issues.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_0843
- name: properties-placeholder-in-delay-pattern
  description: WHEN a route uses delayPattern with a {{placeholder}} that resolves
    to a delay-pattern string, THEN the TG should test that the delay pattern from
    properties is properly parsed and applied during redelivery. This skill ensures
    delay patterns sourced via property placeholders work correctly with onException
    and dead letter channel error handlers.
  code_tags:
  - PROPERTY_PLACEHOLDER_RESOLUTION
  - REDELIVERY_POLICY_CONFIG
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0844
- name: default-cluster-protection
  description: Use when a service method should reject operations (especially DELETE)
    on a predefined or default resource. Test by invoking the forbidden operation
    and asserting an exception is thrown.
  code_tags:
  - VALIDATION
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0845
- name: creator-override-selection-logic
  description: When multiple constructors or factory methods exist for deserialization,
    the creator selection logic may incorrectly overwrite the chosen creator. Apply
    this skill when testing Jackson creator-based deserialization where a class has
    multiple constructors (parameterized and default) or factory methods.
  code_tags:
  - NULL_CHECK
  - VALIDATION
  - TYPE_CONVERSION
  - STATE_MUTATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0846
- name: grouped-exchange-exception-propagation
  description: When using GroupedExchangeAggregationStrategy with multicast, test
    that the aggregated result does not carry failure/exceptions from individual endpoints
    — the grouped exchange should remain unfailed even when a sub-route throws an
    exception.
  code_tags:
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  test_pattern: INTERACTION_TEST
  id: initial_skill_0847
- name: array-key-selector-autoboxing-type-mismatch
  description: Use when testing ArrayKeySelector.getKey() on arrays of boxed types
    (e.g. Integer[], int[]). The java.lang.reflect.Array.get() returns boxed objects,
    but when used with a TupleTypeInfo wrapping a BasicArrayTypeInfo, the setField
    method may expect the primitive type, causing ClassCastException. Test with both
    boxed and primitive array types to verify correct key extraction.
  code_tags:
  - BOUNDARY_CHECK
  - TYPE_CONVERSION
  - ARRAY_INDEX_ACCESS
  - ARRAY_REFLECTION_RETRIEVAL
  - ARRAY_BOXING_REFLECTION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0848
- name: creator-duplicate-overwrite-check
  description: When a class has multiple constructors/factory methods (creators),
    the code may overwrite a previously registered creator with a new one without
    proper deduplication checks, causing property-based constructors to be lost and
    deserialization to fail. Tests should verify that when an explicit property-based
    creator exists alongside delegate creators, the property-based creator is correctly
    selected.
  code_tags:
  - ARGUMENT_VALIDATION
  - NULL_CHECK
  - EMPTY_COLLECTION_HANDLING
  - STATE_MUTATION
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0849
- name: journal-entry-key-idempotent-validation
  description: When testing journal entry key generation, verify that calling getIdForJournalEntry
    multiple times with the same arguments returns consistent results. Mutating shared
    state (like a counter or IdType mapping) during key computation can corrupt subsequent
    keys, so test both the first call AND subsequent calls with the same inputs.
  code_tags:
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  test_pattern: STATE_TEST
  id: initial_skill_0850
- name: gpx-temperature-testing
  description: When testing GPX extensions that handle temperature/atmospheric data
    with different units (celsius vs fahrenheit), use both String and CtTypeReference
    parameter types to verify type-safe attribute handling. The TG should test writing
    temperature data and verify it round-trips correctly without data corruption.
  code_tags:
  - NULL_CHECK
  - VALIDATION
  - BOUNDARY_CHECK
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0851
- name: superclass-type-resolution-in-noclasspath
  description: When analyzing superclass references in no-classpath mode, the JDT
    compiler may resolve a type name to an unexpected class in the same package rather
    than the intended fully-qualified type. This skill teaches how to test that the
    correct superclass type is resolved even when a same-named class exists in the
    local package.
  code_tags:
  - ARGUMENT_VALIDATION
  - BOUNDARY_CHECK
  - EXCEPTION_HANDLING
  test_pattern: STATE_TEST
  id: initial_skill_0852
- name: date-template-substitution-validation
  description: When template expressions (e.g., ${date:pattern}) are used in configuration
    values (like file names), the test must verify they are correctly substituted
    with actual values (not left as literal template strings). This skill teaches
    how to test that date lookups and similar StrLookup template substitutions produce
    resolved values.
  code_tags:
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0853
- name: aggregate-reaggregation-mixin-resolution
  description: When testing aggregate index configurations that involve mixin types,
    ensure that reaggregation logic resolves mixin node types during template merge,
    not just primary types. Without this, mixin-aggregated nodes are lost during re-aggregation.
  code_tags:
  - AGGREGATE_NODE_TYPE_RESOLUTION
  - AGGREGATE_MERGE
  - AGGREGATE_REAGGERATION
  test_pattern: STATE_TEST
  id: initial_skill_0854
- name: quoted-csv-string-escaping
  description: When parsing CSV with quoted strings, test that escaped quote characters
    inside quoted fields (e.g., \" or "") are handled correctly. Also test that field
    delimiters inside quoted strings are not treated as record separators. This is
    particularly important for GenericCsvInputFormat and similar CSV/TSV parsers.
  code_tags:
  - STRING_PARSING_ESCAPING
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0855
- name: lazy-isPageStateless-redirect-to-buffer
  description: When testing page statelessness detection with lazy-initialization
    and redirect-to-buffer rendering, verify that isPageStateless() is called BEFORE
    the page is rendered to buffer. If the page is only rendered lazily, the test
    must ensure the stateless check happens before rendering, otherwise it will incorrectly
    return false.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - VALIDATION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0856
- name: javascript-line-comment-escaping
  description: When testing a JavaScript comment/whitespace stripper, consider slash
    characters inside strings that resemble line comments (//). This skill teaches
    testing for escaped forward slashes inside string literals that should not trigger
    comment state transitions.
  code_tags:
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0857
- name: crypto-mapper-non-encrypted-query-parameters
  description: When testing an encryption/decryption mapper like CryptoMapper, verify
    that requests with non-encrypted query parameters to the home page are correctly
    handled (not rejected) and that the URL for the home page with non-encrypted parameters
    is NOT encrypted to avoid unnecessary redirects. Apply when the mapper has an
    optimization path that may skip encryption for certain URL patterns.
  code_tags:
  - TYPE_CONVERSION
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0858
- name: absolute-url-rendering-with-semicolons
  description: Teaches how to test URL rendering methods that preserve absolute URLs
    when the base URL contains path segments with semicolons. Apply when testing servlet
    response URL encoding where the request URL contains path parameters.
  code_tags:
  - STATE_MUTATION
  - NULL_CHECK
  - VALIDATION
  - ABSOLUTE_URL_RENDERING
  test_pattern: STATE_TEST
  id: initial_skill_0859
- name: purge-revisions-exception-on-merge
  description: When testing document store cleanup operations that purge revision
    data (like split operations), verify that concurrent or subsequent merge operations
    on affected documents correctly throw CommitFailedException rather than succeeding
    and corrupting state.
  code_tags:
  - STATE_MUTATION
  - EXCEPTION_HANDLING
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0860
- name: pageable-listview-empty-page-count
  description: When testing PageableListView or similar pageable components with zero
    items (empty list), the TG should verify division operations that use itemsPerPage
    as a denominator do not cause ArithmeticException. Also test edge cases where
    itemsPerPage is zero to ensure getPageCount() and getCurrentPage() handle division
    safely.
  code_tags:
  - BOUNDARY_CHECK
  - STATE_MUTATION
  - VALIDATION
  - DIVISION_BY_ZERO
  - ARITHMETIC_OVERFLOW
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0861
- name: subselect-mapping-type-conformance
  description: When validating subselect/entity-mapping configurations, test that
    dynamically registered entity types comply with the required contract (e.g., implementing
    an interface or having a specific superclass), and that the code properly handles
    or rejects non-conforming types instead of failing with internal errors like ClassCastException
    or NullPointerException.
  code_tags:
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  - EXCEPTION_HANDLING
  - NULL_CHECK
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0862
- name: endpoint-uri-ampersand-parameter-masking
  description: When resolving Camel endpoint URIs that contain a file path, the `&`
    character in the path must not be interpreted as a URI parameter separator. Test
    both literal paths with `&` and paths followed by actual URI parameters to verify
    correct parsing.
  code_tags:
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0863
- name: ctquery-foreach-type-validation
  description: When iterating over query results using forEach or similar methods,
    test that the iteration does not throw a ClassCastException due to internal state
    corruption in the query chain. This skill is used when a CtQuery has steps like
    map/select/filter that process mixed-type results.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - ARGUMENT_VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0864
- name: parameter-modifier-validation
  description: When building Java source code via JavaPoet's ParameterSpec, modifiers
    are validated per Java language rules. This skill helps test generators write
    tests that ensure parameter modifier validation rejects illegal modifier combinations.
  code_tags:
  - VALIDATION
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0865
- name: encrypted-url-additional-query-parameters
  description: When a CryptoMapper decrypts an encrypted URL, additional query parameters
    appended to the encrypted URL (beyond those in the encrypted payload) must be
    preserved and passed through. This skill teaches testing that decryption preserves
    both original encrypted parameters and extra non-encrypted URL query parameters.
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  - ARGUMENT_VALIDATION
  - PARAMETER_PASS_THROUGH
  - DECRYPTION
  test_pattern: STATE_TEST
  id: initial_skill_0866
- name: proxy-type-parameter-validation
  description: When code processes proxy template parameters accepting Object types
    and uses them as a replaced element, test that both CtTypeReference and String
    type parameters are handled correctly without causing a ClassCastException.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - TYPE_CONVERSION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0867
- name: proxy-delete-after-mutation-verification
  description: Use when testing proxy delete operations that depend on prior state
    mutations (like insert/update). Verify that a delete operation actually removes
    the expected number of entries by checking the count before and after, and that
    the count decreases by exactly the number of rows that were previously inserted.
  code_tags:
  - VALIDATION
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  test_pattern: STATE_TEST
  id: initial_skill_0868
- name: os-activation-profile-reversal-testing
  description: WHEN testing OS-based profile activation with reversed (negated) name
    matching using the '!' prefix, THEN the test must verify that a profile with os.name
    set to "!dddd" (where "dddd" does NOT match the current OS name) is correctly
    activated. This skill tests the negation logic in OperatingSystemProfileActivator's
    determineNameMatch method.
  code_tags:
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - STRING_FORMATTING
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0869
- name: trailing-whitespace-local-name-validation
  description: When validating JCR local names, ensure that names with trailing whitespace
    are rejected as invalid. The TG should test that Namespaces.isValidLocalName()
    returns false for local names ending with whitespace characters.
  code_tags:
  - NULL_CHECK
  - STATE_COMPARISON
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0870
- name: muatble-tree-status-tracking
  description: When a MutableTree is obtained, then later re-obtained after a rebase/refresh,
    the status of child nodes (NEW vs UNCHANGED) should be re-evaluated. Test that
