    - actor
    - testkit
    - testprobe
    - testable
    - wrapper
    - forwarding
    - async
    - tell
    - probe
    - TestableCallContextProvider
    - actor testing
  id: akka-actor-testable-wrapper-async-timing
- name: argument-range-boundary-validation-testing
  description: 'WHEN a method validates numeric arguments with range constraints (e.g.,
    latitude in [-90,90], longitude in [-180,180]), test that: (1) values exactly
    at the boundary are accepted, (2) values just beyond the boundary (e.g., boundary
    + epsilon) throw IllegalArgumentException, (3) all overloads/delegation paths
    that call the validation are tested, (4) both lower and upper bounds are tested
    independently.'
  code_tags:
  - ARGUMENT_VALIDATION
  - BOUNDARY_CHECK
  - EXCEPTION_TEST
  - NUMERIC_RANGE_VALIDATION
  test_pattern: EXCEPTION_TEST
  evolution:
    active: true
    priority: 0
    evidence:
      added: 1
  retrieval:
    applicable_tiers:
    - PASS_FAIL
    - BUG_DETECTED
    transition_tags: []
    keywords:
    - range validation
    - boundary
    - IllegalArgumentException
    - latitude
    - longitude
    - numeric constraint
    - epsilon
  id: argument-range-boundary-validation-testing
- name: comparison-operator-bug-in-stack-algorithm
  description: WHEN a monotonic-stack algorithm uses a comparison operator (<= or
    <) to decide whether to pop elements from the stack, THEN test with consecutive
    equal values to discriminate between `<=` (pop on equal) and `<` (keep on equal).
    The bug is typically that `<=` is used when `<` is correct, causing incorrect
    span/distance calculations for equal values.
  code_tags:
  - COMPARISON_OPERATOR_BUG
  - STACK_ALGORITHM
  - MONOTONIC_STACK
  - BOUNDARY_CHECK
  - EDGE_CASE_INPUT
  test_pattern: STATE_TEST
  evolution:
    active: true
    priority: 0
    evidence:
      added: 1
  retrieval:
    applicable_tiers:
    - BUG_DETECTED
    - PASS_BOTH
    transition_tags: []
    keywords:
    - calculateSpans
    - stock span
    - monotonic stack
    - comparison operator
    - equal prices
    - OnlineStockSpan
    - <= vs <
    - stack pop condition
  id: comparison-operator-bug-in-stack-algorithm
- name: exception-swallowing-catch-block-detection
  description: WHEN a method has a broad catch block (e.g., catch (Exception e)) that
    only prints the stack trace or logs the exception without re-throwing, THEN test
    that domain-specific exceptions are properly propagated to the caller and not
    silently consumed. Verify that the method throws the expected exception type when
    invalid input is provided.
  code_tags:
  - EXCEPTION_HANDLING
  - EXCEPTION_PROPAGATION
  - CATCH_BLOCK
  - ERROR_HANDLING
  test_pattern: EXCEPTION_TEST
  evolution:
    active: true
    priority: 0
    evidence:
      added: 1
  retrieval:
    applicable_tiers:
