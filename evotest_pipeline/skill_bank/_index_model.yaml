    "192.168.254.254") are handled correctly — the hostname should remain the full
    IP string rather than the first segment before the dot.
  code_tags:
  - NULL_CHECK
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0743
- name: filesystem-null-path-npe
  description: When testing FileSystem operations that call listStatus() on a non-existent
    or invalid path, listStatus() may return null. The test should verify the source
    function handles this gracefully without throwing a NullPointerException.
  code_tags:
  - NULL_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0744
- name: empty-input-string-to-null-conversion
  description: When validating text fields with type conversion (e.g., Integer, Long),
