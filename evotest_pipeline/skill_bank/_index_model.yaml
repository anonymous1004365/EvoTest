  code_tags:
  - STATE_MUTATION
  - BOUNDARY_CHECK
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0761
- name: vm-queue-key-collision-across-contexts
  description: When testing VmComponent (or similar Seda-based components) with multiple
