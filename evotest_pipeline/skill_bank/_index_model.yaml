  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  - STATE_CONSISTENCY
  - CONFLICT_HANDLING
  test_pattern: STATE_TEST
  id: initial_skill_0976
- name: throttler-jmx-consistency-under-async-delay
  description: WHEN testing a Throttler configured with asyncDelayed=true via JMX,
