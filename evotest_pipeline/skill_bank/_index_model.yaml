  code_tags:
  - VALIDATION
  - BOUNDARY_CHECK
  - TYPE_CONVERSION
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0555
- name: variable-access-check-null
  description: When testing code that handles variable access or local variable declarations,
    the TG should verify that the code correctly handles multiple declarations of
    the same local variable name without throwing NullPointerException.
  code_tags:
  - NULL_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0556
- name: comparator-null-collection-handling
  description: When implementing equals/comparator methods that compare collections,
    the code may throw NullPointerException when one collection is null and the other
    is empty. TG should test equality between null and empty collections to catch
    missing null-guard logic.
  code_tags:
  - VALIDATION
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0557
- name: invocation-argument-type-checking
  description: When a method invocation returns a type expression (TypeAccess, TypeReference),
    ensure tests verify both result variables and direct method arguments. This catches
    bugs where the internal representation confuses type accesses with method arguments.
  code_tags:
  - VALIDATION
  - NULL_CHECK
  - STATE_MUTATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0558
- name: parent-reference-consistency-after-add
  description: When adding a child element to a parent container that maintains a
    parent reference in the child, verify that the parent reference is correctly set
    both in the child AND that the child appears in the parent's child list. This
    skill helps catch bugs where a parent set operation is missing on one side of
    the bidirectional relationship.
  code_tags:
  - NULL_CHECK
  - VALIDATION
  - STATE_MUTATION
  - PARENT_SET_UPDATES_AFTER_ADD
  test_pattern: STATE_TEST
  id: initial_skill_0559
- name: iteration-statement-traversal
  description: When code visits/iterates over control flow statements, ensure all
    statement types within each case branch are visited, including implicit fall-through
