  - NULL_CHECK
  - VALIDATION
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0996
- name: url-port-parsing-with-path-parameters
  description: When parsing URLs that have a port followed by a semicolon path parameter
