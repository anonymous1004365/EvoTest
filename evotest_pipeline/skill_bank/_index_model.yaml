  - RENDER_COUNTER_TRACKING
  - VISIT_CHILDREN_RENDER_SIDE_EFFECT
  test_pattern: STATE_TEST
  id: initial_skill_1039
- name: iteration-ship-strategy-pushing
  description: WHEN testing optimizer compilation plans involving nested iterations
    (bulk inside delta), THEN verify that partitioning strategies (PARTITION_HASH,
    FORWARD) are correctly pushed through the iteration boundaries. This skill applies
    to workspace optimization tests that inspect ShipStrategyType on Channels of WorksetIterationPlanNode
    and BulkIterationPlanNode.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_1040
- name: ajax-choice-group-validation-on-nested-error
  description: When an AjaxFormChoiceComponentUpdatingBehavior triggers on a RadioGroup/CheckGroup,
