  code_tags:
  - VALIDATION
  - STATE_MUTATION
  - NULL_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_0730
- name: marker-file-exclusive-read-lock-concurrency
  description: When testing file-based exclusive read lock strategies that use marker
    files, write multi-threaded tests to verify that marker lock files are properly
    created during acquisition and cleaned up after release, even under concurrent
    file processing. This ensures no orphan marker files are left behind.
  code_tags:
  - CONCURRENCY
  - RESOURCE_MANAGEMENT
  test_pattern: INTERACTION_TEST
  id: initial_skill_0731
- name: query-result-state-mutation-on-iterate
  description: When a Query Result object may have its internal state mutated by calling
    getSize() during result iteration, the test should verify that getSize() returns
    the correct count before and/or after iteration, not just that iteration works.
