  - ESCAPE_PROCESSING
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0875
- name: lucene-index-cost-fulltext-vs-nodetype
  description: When testing Lucene index planners that evaluate both fulltext and
    nodetype indexes, verify that fulltext indexes are correctly prioritized over
    nodetype-only indexes when both match. Test by creating indexes of both types
