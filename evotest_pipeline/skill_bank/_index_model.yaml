  code_tags:
  - VALIDATION
  - STATE_MUTATION
  - ACCESS_CONTROL_EVALUATION
  test_pattern: STATE_TEST
  id: initial_skill_0773
- name: ognl-method-ambiguity-on-overloaded-methods
  description: WHEN the TG sees OGNL method chains on Java standard library types
    (like String, Integer, etc.) that have overloaded methods with different parameter
    types (e.g., toUpperCase(Locale) vs toUpperCase()), THEN test that the OGNL expression
    resolves without AmbigiousMethodCallException. Includes testing with both no-arg
    and Locale-arg variants of methods.
  code_tags:
  - BOUNDARY_CHECK
  - STATE_MUTATION
  - VALIDATION
  - OGNL_METHOD_AMBIGUITY
  - BEAN_PROPERTY_ASSIGNMENT
  - TYPE_CONVERSION
  test_pattern: INTERACTION_TEST
  id: initial_skill_0774
- name: empty-branch-commit-returns-head-revision
  description: When a MicroKernel implementation's commit method handles empty commits
    (no changes), the test must verify that an empty branch commit returns the current
    head revision of that branch, not the base revision. Use this skill when testing
    branch commit operations where the payload is empty.
  code_tags:
  - STATE_MUTATION
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0775
- name: version-storage-getchildrencount-access
  description: When a test calls Tree.getChildrenCount() on a version storage node
