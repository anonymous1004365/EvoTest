  code_tags:
  - VALIDATION
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  test_pattern: STATE_TEST
  id: initial_skill_0998
- name: jdk-version-range-boundary-testing
  description: Teaches the TG to write thorough boundary tests for JDK version range
