  - VALIDATION
  - BOUNDARY_CHECK
  - TYPE_CONVERSION
  - VERSION_RANGE_COMPARISON
  - STRING_PARSING
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0999
