  - NULL_CHECK
  - TYPE_CONVERSION
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0959
- name: throttler-jmx-race-condition
  description: Teach the TG to detect race conditions in throttler implementations
