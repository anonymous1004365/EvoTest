  code_tags:
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_1049
- name: session-item-access-by-relative-path
  description: When a JCR session method resolves an item by relative path where both
    a Node and a Property match, the session must return the Node (per JCR spec).
    This skill teaches how to test for correct item resolution priority.
  code_tags:
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_1050
- name: submitlink-form-submission-type-check
  description: When testing form submission via SubmitLink, the TG should verify that
    submitting a form using a SubmitLink that wraps an embedded form component triggers
    the form's onSubmit. The key is that the submitter's type must be checked for
    IFormSubmitter, not just checking if a SubmitLink has a form reference.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_1051
- name: error-handler-ref-remove-route-cleanup
  description: When removing a route, ErrorHandlerBuilderRef may not clean up its
