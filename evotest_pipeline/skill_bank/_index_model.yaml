  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - VALIDATION
  test_pattern: INTERACTION_TEST
  id: initial_skill_0770
- name: stateless-form-get-request-method-mismatch
  description: When a form is submitted via GET but the form HTML uses method="post"
    (or vice versa), the StatelessForm's process() method must properly handle the
