  code_tags:
  - NULL_CHECK
  - TYPE_CONVERSION
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0593
- name: multi-parameter-lambda-type-reference-access
  description: When a lambda expression has multiple parameters, accessing the type
    reference (getType()) of one parameter may return a type that shadows another
    parameter's type instead of its own. Use this skill to write tests that verify
    each parameter's type reference is correctly resolved.
  code_tags:
  - TYPE_CONVERSION
  - NULL_CHECK
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0594
- name: class-hierarchy-method-collection-visibility
  description: ''
  code_tags:
  - STATE_MUTATION
  - NULL_CHECK
  - TYPE_CONVERSION
  - GET_ALL_METHODS_OVERRIDE_VISIBILITY
  test_pattern: STATE_TEST
  id: initial_skill_0595
- name: template-parameter-type-validation
  description: Detects bugs where a method modifies abstract syntax tree (AST) elements
    with template parameters of mixed types (e.g., String and CtTypeReference) without
    proper type validation, leading to cast exceptions downstream. Use when testing
    AST manipulation methods that accept or process template parameters.
  code_tags:
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  test_pattern: INTERACTION_TEST
  id: initial_skill_0596
- name: clone-cast-conditional-testing
  description: When cloning AST nodes with cast expressions, the clone operation must
