  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - RESOURCE_MANAGEMENT
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0768
- name: ajax-timer-behavior-parent-resolution
  description: When an AbstractAjaxTimerBehavior is attached to a component, it calls
    getComponent().findParent(Page.class) during onComponentTag. If the behavior's
    component is not yet attached to a Page (e.g., added after the page has been rendered),
