  code_tags:
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - BOUNDARY_CHECK
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0760
- name: home-page-mapper-query-parameter-handling
  description: When testing URL mappers that handle query parameters alongside path
