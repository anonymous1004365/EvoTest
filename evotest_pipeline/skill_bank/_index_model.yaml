  code_tags:
  - VALIDATION
  - NULL_CHECK
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0583
- name: template-parameter-type-validation
  description: When a method accepts template parameters (generic/parametric types),
