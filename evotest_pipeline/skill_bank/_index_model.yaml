    broken Binary objects. Use this skill to test that mixed-type property coercion
    works correctly for both String and Binary types.
  code_tags:
  - ARGUMENT_VALIDATION
  - BOUNDARY_CHECK
  - STATE_MUTATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_1038
- name: render-counter-tracking-with-visitchildren
  description: When a component overrides onAfterRender and uses visitChildren to
