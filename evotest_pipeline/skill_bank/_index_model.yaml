  - VALIDATION
  - ITERATION_STATEMENT_VISITOR
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0560
- name: diamond-operator-type-inference-validation
  description: WHEN the TG encounters code involving generic type inference with the
    diamond operator (e.g., new HashMap<>()) in the context of CtTypeReference / type
    access nodes, THEN it should test that inferred type arguments are properly resolved
    and stored, not silently lost or replaced with defaults. Apply this skill when
    validating type arguments in AST node construction.
  code_tags:
  - TYPE_CONVERSION
  - VALIDATION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0561
- name: creator-nondup-verification-return-guard
  description: When a validation method (like verifyNonDup) changes from void to boolean
    return (indicating whether the creator should be used), the caller must guard
    state mutation behind the return value. Without this guard, duplicate creators
    can overwrite valid creator state, causing deserialization failures.
  code_tags:
  - VALIDATION
  - TYPE_CONVERSION
  test_pattern: STATE_TEST
  id: initial_skill_0562
- name: serialization-state-field-mutation
  description: When a class is serialized/deserialized and a field's value changes
    between serialization and deserialization (due to construction or default values),
    tests should verify that the deserialized object matches the original. Apply when
    JSON or similar serialization omits fields that are reconstructed with different
    values.
  code_tags:
  - STATE_MUTATION
  - TYPE_CONVERSION
  - VALIDATION
  - JSON_SERIALIZATION_VERSIONING
  test_pattern: STATE_TEST
  id: initial_skill_0563
- name: module-info-comment-parsing
  description: When parsing module-info.java files, comments within the module declaration
    can cause parsing failures. This skill teaches how to create tests that ensure
    comments inside module declarations are handled correctly.
  code_tags:
  - MODULE_INFO_JAVA_PARSING
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0564
- name: field-access-target-type-validation
  description: When setting a CtExpression target on a field access that previously
    had a CtTypeReference target (type-level), the type must be properly validated.
    Use this skill when calling setTarget() on field accesses where the target switches
    between type and instance references.
  code_tags:
  - EXPRESSION_TARGET_SETTING
  test_pattern: STATE_TEST
  id: initial_skill_0565
- name: type-reference-qualified-name-number-prefix
  description: WHEN validating that all type references to a local type produce correct
    qualified names, test that qualifiers do not start with numeric characters. A
    local type's qualified name may unexpectedly include a numeric prefix from its
    parent, causing incorrect string representations for type references.
  code_tags:
  - NULL_CHECK
  - VALIDATION
  - TYPE_CONVERSION
  test_pattern: STATE_TEST
  id: initial_skill_0566
- name: executable-reference-type-mismatch
  description: When handling executable reference expressions from implicit type declarations,
    test that both the declaring type and actual type parameters are correctly extracted.
    Without this skill, the TG may miss testing scenarios where method references
    use types that differ from the declaring class's type parameters.
  code_tags:
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  - NULL_CHECK
  - TYPE_CONVERSION
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0567
- name: template-parameter-type-validation
  description: When injecting or validating proxy template parameters, the type of
    each value must match the declared CtTypeReference. A bug occurs when only String
    types are tested but the code accepts the parameter without verifying actual type
    compatibility — always test with non-String types like CtTypeReference objects.
    Use this skill to catch cases where loose typing lets incompatible parameters
    silently pass through.
  code_tags:
  - VALIDATION
  - BOUNDARY_CHECK
  - STATE_MUTATION
  - ELEMENT_TYPE_MISMATCH
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0568
- name: insert-before-after-switch-case
  description: When inserting statements before or after elements in a CtBlock/CtCase
    within a switch-case structure, the TG should test insertion at the child caretaker
    node (switch case body) level, not the switch parent level. This skill applies
    when insertBefore/insertAfter is called on SwitchCase children or Case nodes.
  code_tags:
  - VALIDATION
  - ARGUMENT_VALIDATION
  - NULL_CHECK
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  test_pattern: STATE_TEST
  id: initial_skill_0569
- name: template-parameter-type-validation
  description: When validating proxy template parameters that can be either a String
    or a typed reference, test with all valid types including CtTypeReference to ensure
    type-specific validation logic works correctly and does not throw unexpected exceptions.
  code_tags:
  - ARGUMENT_VALIDATION
  - TYPE_CONVERSION
  - STATE_MUTATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0570
- name: template-parameter-type-validation
  description: When a method receives a collection (e.g., Set, List) of mixed-type
    parameters (e.g., Strings, CtTypeReferences) for template/proxy resolution, TG
    should test with both type categories to ensure the method handles heterogeneous
    types correctly without crashing or returning incorrect results.
  code_tags:
  - STATE_MUTATION
  - VALIDATION
  - TYPE_CONVERSION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0571
- name: catch-variable-type-resolve
  description: When a CtCatchVariable (or similar catch variable) is declared with
    a union type (multi-catch), its getType() method may return null. Tests must verify
    that getType() returns a non-null CtTypeReference for each exception type in the
    multi-catch, including non-generic and generic exception types.
  code_tags:
  - TYPE_CONVERSION
  - NULL_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_0572
- name: nullable-type-reference-validation
  description: When processing imported type references that may be null (e.g., CtTypeReference.getTypeDeclaration()),
    test that the code handles null instead of throwing NullPointerException. This
    skill applies when methods iterate over imports and call methods on potentially
    null type references.
  code_tags:
  - NULL_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0573
- name: exotic-classloader-type-compatibility
  description: When a custom ClassLoader returns incompatible types (e.g. objects
    not castable to String or CtTypeReference), the test should verify that the compiler
    handles such exotic types gracefully without throwing false-positive compilation
    errors. This skill applies to scenarios where class loading and reflection may
    produce unexpected type mismatches.
  code_tags:
  - VALIDATION
  - TYPE_CONVERSION
  - NULL_CHECK
  - CLASS_LOADING_AND_REFLECTION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0574
- name: field-reference-fqn-validation
  description: When constructing fully-qualified field references via getFQNofFieldReference,
    teach that declaring types may be null and must be handled. Also teach that the
    access target (targetType) may need to be used as a fallback. Apply this skill
    when processing field references with potential null declaring types.
  code_tags:
  - TYPE_CONVERSION
  - ARGUMENT_VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0575
- name: creator-template-parameter-type-validation
  description: When discovering creator/injectable value methods via reflection, the
    TG should test that both String type names and CtTypeReference type parameters
    are correctly accepted and do not cause duplicate entries or exceptions during
    method registration.
  code_tags:
  - TYPE_CONVERSION
  - STATE_MUTATION
  - CREATOR_TEMPLATE_PARAM_TYPE
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0576
- name: annotation-on-parameter-reflection
  description: When retrieving annotations from method parameters using reflection-like
    access (annotationType on parameter), the implementation may accidentally check
    annotations on the wrong element (e.g., method vs. parameter). Test with at least
    two different annotation types on a parameter to catch this bug.
  code_tags:
  - ANNOTATION_PRESENCE_CHECK
  - TYPE_CONVERSION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0577
- name: primitive-type-access-validation
  description: When dealing with type access on primitive types (e.g., int, void),
