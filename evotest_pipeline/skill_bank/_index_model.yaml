  code_tags:
  - PATH_PARSING
  - STRING_MANIPULATION
  - BOUNDARY_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_1045
- name: null-input-to-string-split
  description: When a method takes a comma-separated String parameter that is parsed
