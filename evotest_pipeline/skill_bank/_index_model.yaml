  code_tags:
  - LEVEL_RANGE_EDGE
  - BOUNDARY_CHECK
  - NULL_CHECK
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0747
- name: shell-command-pattern-parameter-validation
