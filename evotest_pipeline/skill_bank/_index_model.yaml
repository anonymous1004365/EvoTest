    type (e.g., int).
  code_tags:
  - ARGUMENT_VALIDATION
  - TYPE_CONVERSION
  - NULL_CHECK
  - VALIDATION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_1011
- id: initial_skill_1012
  name: initial_skill_1012
- name: replication-table-iterator-configuration
  description: Teaches how to verify that a ReplicationTableUtil-like utility sets
