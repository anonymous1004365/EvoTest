  description: ''
  code_tags:
  - STATE_MUTATION
  - TYPE_CONVERSION
  test_pattern: STATE_TEST
  id: initial_skill_0590
- name: package-reference-replacement-type-consistency
  description: When replacing one package reference with another in a code model,
