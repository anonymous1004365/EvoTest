  - SWAGGER_RESOURCE_NOT_FOUND_HANDLING
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0725
- name: number-conversion-overflow-validation
  description: WHEN testing number converters (Long, Integer, etc.) THEN validate
    that converting values outside the target type's range throws ConversionException.
    This skill helps catch missing overflow checks in type conversion implementations.
