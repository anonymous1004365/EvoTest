  code_tags:
  - ORDER_DEPENDENCY
  - STATE_MUTATION
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0584
- name: empty-block-state-mutation
  description: When adding empty blocks to AST structures like CtBlock, the implicit
