skills:
- name: akka-actor-testable-wrapper-async-timing
  description: WHEN testing an Akka actor wrapper that forwards messages to both a
    TestProbe and an actual actor, recognize that the actual actor processes messages
    asynchronously. Side effects (store persistence, state changes) cannot be asserted
    immediately after tell() without proper synchronization.
  code_tags:
  - ACTOR_TESTING
  - ASYNC_PROCESSING
  - PROBE_SYNCHRONIZATION
  - STATE_MUTATION
  - CONCURRENCY
  test_pattern: STATE_TEST
  evolution:
