  code_tags:
  - NULL_CHECK
  - VALIDATION
  - ARGUMENT_VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0585
- name: string-concatenation-within-operator-tostring
  description: WHEN overriding toString() on operator expressions (like UnaryOperator)
