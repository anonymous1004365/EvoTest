  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  - TYPE_CONVERSION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0597
- name: jdk-unsupported-serialization-type
  description: When a custom Java 8+ date/time type (like java.time.Instant) is serialized
    without proper Jackson module registration, the serializer must be explicitly
    configured. This skill teaches how to verify that Jackson correctly serializes/deserializes
    user-defined types when using primitive-like creator properties.
  code_tags:
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0598
- name: string-literal-template-type-validation
  description: When validating template parameters in string literal methods, test
    that non-String types (like CtTypeReference) are not incorrectly treated as String
    parameters. This skill helps catch bugs where instanceof checks fail to properly
    distinguish between template parameter types.
  code_tags:
  - VALIDATION
  - ARGUMENT_VALIDATION
  - NULL_CHECK
  - TYPE_CONVERSION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0599
- name: executable-reference-type-validation
  description: When creating executable references (e.g., constructor references like
    `this::new`), the test must validate that correct types (CtTypeReference, not
    raw String or wrong type) are used to build the reference. Without proper type
    selection, the reference silently fails or uses the wrong declaring type.
  code_tags:
  - TYPE_CONVERSION
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0600
- name: template-proxy-parameter-type-validation
  description: When a method accepts parameters of type `Object` but internally casts
    or processes them as a specific type (e.g., `CtTypeReference`), the TG should
    test with both valid and invalid types to ensure proper validation. This skill
    prevents bugs where invalid types silently pass validation.
  code_tags:
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0601
- name: constructor-parameter-type-mismatch
  description: Helps detect bugs where constructor parameters for non-top-level classes
    (like inner, anonymous, or local classes) have their types incorrectly handled,
    especially when the constructor's declaring class differs from the enclosing class.
    Use this skill when testing code that introspects or builds constructor parameter
    types.
  code_tags:
  - NULL_CHECK
  - TYPE_CONVERSION
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0602
- name: template-parameter-type-validation
  description: When validating proxy template parameters or any API that accepts both
    type-safe references and plain strings, test that the validation/logic works correctly
    for all supported parameter types — not just the most common one. The TG should
    include at least one test case using each possible parameter type variant.
  code_tags:
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0603
- name: class-dollar-sign-traversal-validation
  description: When traversing class names containing dollar signs for nested classes,
    the traversal logic can silently skip or return null if it encounters segments
    without corresponding real types. The TG should test that dollar-separated class
    name segments are each resolved as distinct type references and that the method
    returns a non-null, properly typed result.
  code_tags:
  - VALIDATION
  - TYPE_CONVERSION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0604
- name: lucene-index-dir-wrapping-order
  description: When configuring a Lucene index with a Directory wrapper (e.g., copy-on-read),
    the `:indexPath` property must be set BEFORE wrapping the directory. Tests that
    modify index definitions and assert on the resulting NodeState should verify that
    the `:indexPath` property is present even when the index definition includes a
    directory wrapper configuration, and catch cases where directory wrapping is done
    before the index path is set.
  code_tags:
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0605
- name: missing-equals-hashcode-config-class
  description: ''
  code_tags:
  - STATE_MUTATION
  - CACHING_KEY_EQUALS_HASHCODE
  test_pattern: STATE_TEST
  id: initial_skill_0606
- name: component-renderer-markup-null-check
  description: When a component that overrides getMarkup() returns null, ComponentRenderer.renderComponent()
    should handle this gracefully instead of throwing a NullPointerException. Tests
    should verify that components returning null markup are handled without NPE.
  code_tags:
  - NULL_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0607
- name: provider-name-conversion-to-null
  description: When a constructor normalizes null or empty strings to null for a provider
    name field, tests must verify that strings reconstructed from serialized form
    correctly preserve this null normalization. This skill teaches testing round-trip
    conversion through string representation.
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0608
- name: get-java-type-returns-null-for-non-entity-types
  description: When a method called getJavaType() is used to convert CtType/entity
    types to internal representations, it may return null for non-entity types like
    CtTypeReference or certain types without a Java type mapping. Tests should verify
    that such calls handle null returns properly and that all expected type categories
    are covered.
  code_tags:
  - NULL_CHECK
