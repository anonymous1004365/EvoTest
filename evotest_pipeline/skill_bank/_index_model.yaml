  code_tags:
  - STATE_MUTATION
  - ARRAY_ITERATION
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0592
- name: unknown-declaration-proxy-type-resolution
  description: When a test generates or processes proxy/unknown type declarations,
