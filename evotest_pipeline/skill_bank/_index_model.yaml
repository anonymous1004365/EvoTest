- name: branch-merge-conflict-detection-for-changed-properties
  description: Teaches how to test that merging branches with conflicting property
    changes correctly throws DocumentStoreException. Use this skill when testing conflict
    detection logic in document-store-based branching systems where two branches independently
    modify the same property.
  code_tags:
  - STATE_MUTATION
  - CONCURRENCY
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0001
- name: superclass-type-mismatch-on-null
  description: When querying class hierarchy information (e.g., getSuperclass), the
    method may incorrectly return a non-null TypeReference wrapping a null actual
    type instead of returning null. Apply this skill to test methods that return class/type
    references for scenarios where a class has no superclass (e.g., java.lang.Object
    or interfaces).
  code_tags:
  - TYPE_CONVERSION
  - NULL_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0002
- name: generic-type-signature-matching
  description: When testing type signature comparison methods that involve generic
    types, identify cases where type arguments are used (e.g., List<String> vs List<Integer>)
    and verify that the method correctly distinguishes them as different signatures.
    This skill applies to any method that compares type references or method signatures
    involving parameterized types.
  code_tags:
  - TYPE_CONVERSION
  - BOUNDARY_CHECK
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0003
- name: execfile-command-handling-messages
  description: When testing shell execfile commands with invalid commands, ensure
    that the shell properly reads all output from the execfile execution and that
    the output contains the expected messages. This applies when executing a file
    containing unknown or invalid commands via the execfile mechanism.
  code_tags:
  - VALIDATION
  - STATE_MUTATION
  - EXCEPTION_HANDLING
  test_pattern: INTERACTION_TEST
  id: initial_skill_0004
- name: pagination-native-query-exception
  description: When validating method arguments for native SQL queries, ensure pagination
    is rejected with a precise exception (IllegalStateException with clear message)
    rather than a generic NullPointerException or IllegalArgumentException.
  code_tags:
  - VALIDATION
  - EXCEPTION_HANDLING
  - TYPE_CONVERSION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0005
- name: node-locator-immutable-equality
  description: When implementing value objects with immutable-like semantics, test
    that equals() defends against mutation of internal state by different parameter
    types and ensures equality holds across type-consistent construction paths.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - STATE_MUTATION
  - VALIDATION
  - TYPE_CONVERSION
  test_pattern: STATE_TEST
  id: initial_skill_0006
- name: datepicker-timezone-type-conversion
  description: When testing date/time picker components that serialize dates to strings
    in JavaScript (Date(...) constructor), the test must verify timezone-aware conversion
    correctly formats dates across different source timezones. This skill ensures
    date formatting converts properly and handles type conversion from DateTimeZone
    to string.
  code_tags:
  - TYPE_CONVERSION
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0007
- name: class-visit-filter-interface-conformance
  description: When using ClassVisitFilter with an interface type, the visitObject
    method uses isAssignableFrom to check conformance. The trigger test verifies this
    works for String (a concrete class) but fails to test with an interface type where
    the object implements the interface indirectly. This skill teaches the TG to test
    ClassVisitFilter with interface types and objects that implement them.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - STATE_MUTATION
  test_pattern: INTERACTION_TEST
  id: initial_skill_0008
- name: duplicate-address-detection
  description: WHEN testing API helper classes that manage address resources, THEN
    verify that duplicate address detection correctly prevents adding addresses with
    the same name and address space. This skill focuses on validating that address
    uniqueness constraints are enforced across combined name+namespace+address-space
    tuples.
  code_tags:
  - VALIDATION
  - STATE_MUTATION
  - DUPLICATE_ADDRESS_DETECTION
  test_pattern: STATE_TEST
  id: initial_skill_0009
- name: regex-encoding-validation
  description: WHEN validating iterator options that involve character encoding (e.g.,
    Charset.forName()), THEN test that an IllegalArgumentException is thrown for invalid
    encoding names. This skill applies to any OptionDescriber whose validateOptions
    method calls Charset.forName() on user-provided strings.
  code_tags:
  - BOUNDARY_CHECK
  - NULL_CHECK
  - STATE_MUTATION
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0010
- name: thrift-deserialization-null-validation
  description: When a class has a constructor that accepts a Thrift-generated object
    (e.g., TMutation, TKey), the TG must test that invalid/null fields in the Thrift
    object are validated and throw IllegalArgumentException. This skill applies to
    deserialization constructors that copy fields from Thrift types.
  code_tags:
  - VALIDATION
  - TYPE_CONVERSION
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0011
- name: spillable-subpartition-view-release
  description: When a SpillableSubpartition view is created via readView and then
    the parent partition is released, any resources held by the view (e.g., file channels)
    must also be properly released. Use this skill when testing that releasing a parent
    SpillableSubpartition correctly triggers view cleanup, preventing resource leaks
    or incomplete view state transitions.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - VALIDATION
  - RESOURCE_MANAGEMENT
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0012
- name: stats-collector-method-invocation-verification
  description: Teaches TG to verify that stats collector methods receive the correct
    metric values when background read/write operations are performed, using both
    unit-level and integration-level testing patterns.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - VALIDATION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0013
- name: surrogate-character-encoding
  description: When encoding or escaping JSON strings that may contain surrogate pairs
    (Unicode characters outside the BMP), test that both high and low surrogates in
    a surrogate pair are correctly preserved. Without proper handling, lone surrogates
    or broken pairs can be silently corrupted or replaced with '?'.
  code_tags:
  - STRING_PARSING
  - VALIDATION
  - BOUNDARY_CHECK
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0014
- name: protocol-message-parsing-null-safe
  description: When parsing device protocol messages where indexed fields may be missing,
    ensure tests include both trimmed and un-trimmed messages as well as zero-length
    trailing fields, verifying that field accessors handle null or empty results without
    throwing.
  code_tags:
  - BOUNDARY_CHECK
  - NULL_CHECK
  - STATE_MUTATION
  - TYPE_CONVERSION
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0015
- name: child-node-constraint-violation-exception-type
  description: WHEN testing node type constraints that reject child nodes (e.g., nt:query),
    THEN the test must verify that javax.jcr.nodetype.ConstraintViolationException
    is thrown rather than a generic javax.jcr.RepositoryException. This skill covers
    writing tests that correctly validate the exception type when adding child nodes
    to node types that do not accept children, even when properties are also set.
  code_tags:
  - CONSTRAINT_VIOLATION_TYPE
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0016
- name: shallow-copy-shared-mutable-state
  description: Detects when shallowCopy() shares mutable internal state (conditions
    Map) between original and copy, and tests that add/remove conditions on one doesn't
    affect the other. Use this skill when testing copy/clone methods on mutable objects.
  code_tags:
  - STATE_MUTATION
  - NULL_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_0017
- name: type-reference-equals-with-null-proxy
  description: WHEN testing CtTypeReference equality, THEN test that equals() and
    hashCode() are consistent even when some fields are null and others are populated
    with proxy objects. This skill catches bugs where accessing proxy fields during
    equality comparison modifies internal state, breaking hashCode consistency.
  code_tags:
  - TYPE_REFERENCE_EQUALS
  - STATE_MUTATION
  - TYPE_CONVERSION
  test_pattern: STATE_TEST
  id: initial_skill_0018
- name: data-table-no-records-toolbar-initialization
  description: When testing a DataTable that adds a NoRecordsToolbar (or similar conditional-visibility
    toolbar component), test that the toolbar does not throw unhandled exceptions
    during its onConfigure() method before the table has its data provider set up.
    This skill catches bugs where toolbar components try to access uninitialized state.
  code_tags:
  - TYPE_HIERARCHY_CHECK
  - EXCEPTION_HANDLING
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0019
- name: setiter-command-name-validation
  description: When testing shell commands that configure iterators via the `setiter`
    command, the TG should verify that passing a class name without an explicit iterator
    name in the `-name` option causes an IllegalArgumentException. The bug manifests
    when `setiter -class <ClassName> -p <priority>` is used without `-name <name>`
    — the buggy code incorrectly requires a name but should infer it from the iterator's
    OptionDescriber.
  code_tags:
  - ARGUMENT_VALIDATION
  - EXCEPTION_HANDLING
  - USER_INPUT_EDGE_CASE
  test_pattern: STATE_TEST
  id: initial_skill_0020
- name: file-move-failed-path-construction
  description: WHEN configuring file component move/moveFailed with relative paths,
    THEN verify the constructed target path correctly resolves relative to the original
    file's parent directory, not the work directory. This skill prevents path duplication
    bugs where moved file paths contain repeated directory segments.
  code_tags:
  - PATH_PARSING_VALIDATION
  - STATE_MUTATION
  - RESOURCE_MANAGEMENT
  test_pattern: STATE_TEST
  id: initial_skill_0021
- name: annotation-metadata-revision-date-null-handling
  description: When constructing a revision metadata object (e.g., AnnotationRevisionMetadata)
    that parses a revision number from a custom annotation, ensure the test validates
    that a null or invalid revision number does not crash the constructor — it should
    either throw a meaningful exception or handle it gracefully rather than triggering
    a NullPointerException or NumberFormatException.
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0022
- name: enclosure-child-removal-visibility-reset
  description: WHEN a Wicket Enclosure component has children that may be removed
    during rendering (e.g., by an AjaxFallbackLink that detaches them via remove),
    THEN test that the Enclosure's child visibility tracking correctly handles the
    removal without throwing an IndexOutOfBoundsException.
  code_tags:
  - CHILD_REMOVAL
  - ENCLOSURE_INTERACTION
  test_pattern: STATE_TEST
  id: initial_skill_0023
- name: url-path-segment-validation-for-mapper-matching
  description: When a URL mapper uses both the request URL and the client base URL
    to determine if a request matches, the TG should test edge cases where the request
    URL has fewer segments than the base URL, particularly when the request URL contains
    only the page identifier without the namespace prefix.
  code_tags:
  - VALIDATION
  - PATH_PARSING_VALIDATION
  - BOUNDARY_CHECK
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0024
- name: table-path-tableid-validation
  description: When writing tests for path construction methods that extract table
    IDs from path components, test that paths missing a table ID component throw an
    IllegalArgumentException. This applies to getFullPath() variants that parse paths
    for VolumeManager.
  code_tags:
  - PATH_TABLEID_EXTRACTION
  - VOLUME_PATH_CONSTRUCTION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0025
- name: zookeeper-node-race-condition-testing
  description: When testing code that watches ZooKeeper nodes for changes, the TG
    should simulate race conditions where nodes disappear between listing and watching
    to verify proper KeeperException handling and retry logic.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  test_pattern: INTERACTION_TEST
  id: initial_skill_0026
- name: package-request-target-url-creation-validation
  description: When constructing URL coding strategy targets, test that the strategy
    correctly validates path patterns and handles requests to non-existent or invalid
    targets. Use this skill when a method creates or resolves URL-encoded paths with
    parameter templates.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0027
- name: template-parameter-type-validation
  description: Teaches the TG to validate proxy template parameters by testing with
    multiple distinct type variants (String, CtTypeReference, etc.) to catch incorrect
    type equality checks when matching template parameters against class fields.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - VALIDATION
  - TYPE_HIERARCHY_CHECK
  - TYPE_REFERENCE_EQUALS
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0028
- name: cookie-preservation-across-redirect
  description: When testing cookie handling across request handler redirects, verify
    that cookies set before a NonResettingRestartException are not lost by the BufferedWebResponse.writeTo()
    operation. The cookie collection should maintain order-preserving semantics during
    metadata transfer.
  code_tags:
  - ORDER_DEPENDENCY
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0029
- name: ajax-base-url-validation
  description: When a method parses a request header or parameter to construct a URL
    and then returns it as the response, the test should validate both the happy path
    (header present) and edge cases (header missing, parameter missing). This skill
    teaches how to write tests that catch bugs where a missing required header silently
    produces incorrect output instead of falling back to a sensible default or throwing
    an appropriate error.
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  - EXCEPTION_HANDLING
  test_pattern: STATE_TEST
  id: initial_skill_0030
- name: lifecycle-strategy-context-start-on-restart
  description: When testing CamelContext lifecycle with LifecycleStrategy hooks, ensure
    that onContextStart is called exactly once per start sequence, including on restart
    after a stop. This skill helps detect bugs where stateful observers fail to reset
    counters or where the context skips lifecycle callbacks on subsequent starts.
  code_tags:
  - ARGUMENT_VALIDATION
  - BOUNDARY_CHECK
  - INHERITANCE_CHECK
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  test_pattern: STATE_TEST
  id: initial_skill_0031
- name: query-string-equals-sign-in-value
  description: WHEN parsing URL query strings with encoded equals signs (=) in parameter
    values, THEN test that the parser correctly preserves equals signs that appear
    inside parameter values, not just the first occurrence. The bug causes a parser
    to split on every '=' character instead of only the first '=' per key=value pair.
  code_tags:
  - QUERY_STRING_PARSING
  - STRING_PARSING
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0032
- name: safe-copy-behavior
  description: When a class implements a `copy(boolean safeCopy)` method where `safeCopy=true`
    should produce a defensive copy but the buggy version has `getIn()` returning
    null or fails to initialize the message, test that the safe copy produces a proper
    Exchange with non-null In message, headers, and that modifications to the copy
    do not affect the original.
  code_tags:
  - VALIDATION
  - NULL_CHECK
  - EXCEPTION_HANDLING
  - SAFE_COPY
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0033
- name: type-reference-equals-nullpointer
  description: When a class overrides equals() and compares its own type reference
    field with a parameter that may not be the same type, the TG should test with
    objects of different types to catch potential ClassCastException or NullPointerException.
    This applies specifically to CtTypeReference.equals() implementations that fail
    to guard against type mismatches.
  code_tags:
  - TYPE_REFERENCE_EQUALS
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0034
- name: border-body-visibility-component-use-check
  description: When testing a Wicket Border whose body starts hidden, the TG should
    verify that DebugSettings.setComponentUseCheck(true) does not throw a component-use-check
    failure. This catches cases where children added to the Border instead of its
    body cause false positives in the component use check.
  code_tags:
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  - CHILD_REMOVAL
  test_pattern: STATE_TEST
  id: initial_skill_0035
- name: rebase-with-failed-merge-state-recovery
  description: When testing rebase operations that are followed by a failed merge,
    the TG should verify that the branch state is properly reset after the merge failure.
    The test must ensure that a subsequent merge attempt on the rebased branch succeeds
    and produces the expected final state.
  code_tags:
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  - CONCURRENCY
  test_pattern: STATE_TEST
  id: initial_skill_0036
- name: method-reference-super-executable-type-check
  description: When testing method references with super executable calls where the
