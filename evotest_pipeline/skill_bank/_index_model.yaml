  - NULL_CHECK
  - BOUNDARY_CHECK
  - VALIDATION
  - OBJECT_GRAPH_DEEP_MERGE
  test_pattern: STATE_TEST
  id: initial_skill_0765
- name: parse-tree-node-range-correction
  description: When building a parse tree node that wraps a single child node inside
