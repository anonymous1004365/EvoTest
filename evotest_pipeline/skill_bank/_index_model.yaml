    references does not produce a NullPointerException or ClassNotFoundException,
    ensuring the type reference system handles primitives gracefully.
  code_tags:
  - TYPE_CONVERSION
  - VALIDATION
  - PRIMITIVE_TYPE_ACCESS
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0578
- name: comment-association-lost-on-copy
