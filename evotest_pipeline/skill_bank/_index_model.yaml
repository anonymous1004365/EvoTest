  - UNICODE_ESCAPE_DECODING
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0111
- name: inherited-model-flag-reset-on-model-change
  description: When a component's model is changed, the FLAG_INHERITABLE_MODEL flag
