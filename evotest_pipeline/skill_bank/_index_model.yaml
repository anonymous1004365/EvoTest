    like @see, @link, and @throws.
  code_tags:
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - BOUNDARY_CHECK
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0110
- name: unicode-escape-decoding
  description: When parsing JSON-like tokens that contain Unicode escape sequences
