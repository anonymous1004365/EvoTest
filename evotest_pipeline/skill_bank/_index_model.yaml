- name: path-compatibility-score-accuracy
  description: WHEN testing mappers that return compatibility scores for request path
    ranking, THEN verify the scoring logic returns correct values for both exact matches
    (highest score) and various path lengths. FOR EXAMPLE, for PackageMapper, test
    that getCompatibilityScore returns the correct score by checking that a path with
    the right number of segments relative to the page class package depth scores properly,
    catching bugs where the score is miscalculated (e.g., returning 2 instead of 4).
  code_tags:
  - ARGUMENT_VALIDATION
  - NULL_CHECK
  - BOUNDARY_CHECK
  - PATH_COMPATIBILITY_SCORE
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_1015
- name: locale-extraction-from-filename-without-separator
  description: WHEN testing methods that extract locale/prefix from filenames using
    separator-based parsing (e.g., Strings.lastPathComponent), THEN test with filenames
    that contain no separator character to verify graceful handling. This skill prevents
    bugs where methods fail on filenames without the expected separator.
  code_tags:
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_1016
- name: template-parameter-type-validation
  description: This skill teaches TG to write tests that verify template parameter
    type validation in parsers, specifically when iterating over a product type hierarchy
    where only certain parameter types (e.g., String) are recognized while others
    (e.g., CtTypeReference) are silently ignored, causing different interpretation
    of the same construct.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_1017
- name: branch-commit-recovery-ordering
  description: Tests recoverBranchCommit should ensure all pending branch operations
    are properly merged, especially when branches share commit roots. Use STATE_TEST
    to verify recovered branches reflect all expected state changes.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_1018
- name: index-based-segment-removal-off-by-one
  description: When a URL object segments list is manipulated by removing an element
    at an index derived from mountSegments.length, the removal shifts subsequent elements.
    Tests must verify that the resulting segments list contains the expected page
    parameters after the removal.
  code_tags:
  - ORDER_DEPENDENCY
  - STATE_MUTATION
  - ARGUMENT_VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_1019
- name: reattach-versioned-page-deserialization
  description: When testing page versioning with deserialization/reattachment, test
    that re-attaching a page after deserialization restores its internal versioning
    state correctly. This prevents StaleVersionException on subsequent detach calls.
  code_tags:
  - VERSIONING_STATE
  test_pattern: STATE_TEST
  id: initial_skill_1020
- name: error-handler-header-preservation-with-onprepare
  description: When an error handler (e.g., DeadLetterChannel) uses onPrepareProcessor,
    the processor must be invoked before the exchange is sent to the dead letter queue.
    Without this, custom headers set by onPrepare are lost. Test that headers set
    in onPrepare are present in the dead letter / error exchange.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  - ERROR_HANDLER_HEADER_PRESERVATION
  test_pattern: INTERACTION_TEST
  id: initial_skill_1021
- name: bookmarkable-mapper-relative-page-decoding
  description: When testing URL mappers that generate relative URLs for page instances,
    verify that the mapper can also decode (resolve) those relative URLs back to a
    valid request handler. Tests should cover both String-based and page class-based
    mount paths in the same mapping configuration.
  code_tags:
  - VALIDATION
  test_pattern: INTERACTION_TEST
  id: initial_skill_1022
- name: null-check-annotation-filter-path
  description: When a method extracts a value from an annotation (like @WebFilter.value)
    and uses it as a filter path, the TG should test that the code handles a null
    annotation gracefully, expecting a NullPointerException on the buggy version due
    to missing null checks.
  code_tags:
  - NULL_CHECK
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1023
- name: link-parser-markup-avoidance
  description: This skill teaches how to test parsers that should avoid processing
    content that already contains HTML markup. When a link parser detects '<' in the
    input, it should skip link replacement entirely and return the text unchanged.
  code_tags:
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_1024
- name: inline-enclosure-attribute-backup-restore
  description: When InlineEnclosure containers receive generated markup attributes
    (like wicket:name) during rendering, the test should verify that attribute values
    are properly restored to their original state after enclosures are closed. This
    is critical for Ajax updates where placeholder tags must carry correct attributes.
  code_tags:
  - AJAX_INLINECLOSURE_PLACEHOLDER
  test_pattern: STATE_TEST
  id: initial_skill_1025
- name: repository-metadata-version-tag-presence
  description: When a RepositoryMetadata subclass stores mainVersion/releaseVersion,
    the TG should verify that calling updateRepositoryMetadata preserves these values
    and does not drop version tags for strings like "LATEST" or "RELEASE". The test
    should create metadata with a main version set to "LATEST" and verify that after
    update, the version tag is still present.
  code_tags:
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_1026
- name: revision-cache-read-boundary
  description: When testing revision lookup logic that scans local and previous document
    changes, verify not only the returned newest revision but also that the lookup
    stops after the first relevant change. This skill catches bugs where correct answers
    are produced through excessive reads of previous documents or split documents.
  code_tags:
  - REVISION_CACHE_READS
  - PERFORMANCE_LOOP_COST
  - TRIGGER_EXCESSIVE_RPC_CALLS
  test_pattern: PERFORMANCE_TEST
  id: initial_skill_1027
- name: cache-refresh-returns-stale-value-after-eviction
  description: WHEN testing a cache with a refresh mechanism (e.g. CacheLIRS.refresh),
    THEN test that after an entry is evicted and then reloaded, calling refresh returns
    the newly loaded value, not the stale evicted value. This catches bugs where refresh
    uses an outdated internal reference instead of re-loading from the CacheLoader.
  code_tags:
  - STATE_MUTATION
  - CONCURRENCY
  test_pattern: STATE_TEST
  id: initial_skill_1028
- name: filter-fulltext-property-restriction-leak
  description: When a query Filter uses both full-text constraints (CONTAINS) and
    property restrictions (e.g., metadata path), a copy-on-write operation (FilterImpl#copy
    or constructor copy) must build a fresh property restrictions map; otherwise the
    copy shares state with the original, leaking old restrictions from the original
    into the copy's toString. Test by constructing a full-text filter, then forcing
    a copy/restrict, and verifying toString() does NOT contain property restrictions
    that were never set on the copy.
  code_tags:
  - STATE_MUTATION
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_1029
- name: post-delegation-classloader-creation
  description: When a classloader is created without post-delegation mode, tests must
    verify that parent-first delegation works correctly by checking that classes available
    in the parent are loaded from the parent, not the child. This skill applies to
    any VFS classloader creation using preDelegation=false.
  code_tags:
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  - BOUNDARY_CHECK
  - CLASS_LOADER_DELEGATION
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_1030
- name: list-record-iteration-boundary
  description: When testing multi-level list data structures with recursive getEntries/getEntry
    calls, test boundary sizes like LEVEL_SIZE and LEVEL_SIZE * LEVEL_SIZE + 1 to
    catch bucket size calculation errors that cause IllegalArgumentException during
    iteration.
  code_tags:
  - NULL_CHECK
  - RESOURCE_MANAGEMENT
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1031
- name: duplicate-type-extraction-validation
  description: When testing type extraction logic for POJOs or nested types, ensure
    that duplicate type variables or type arguments (e.g., same TypeVariable appearing
    multiple times in a type hierarchy) are handled correctly without throwing an
    InvalidTypesException. This skill applies to TypeExtractor tests in Flink's type
    system.
  code_tags:
  - NULL_CHECK
  - TYPE_CONVERSION
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1032
- name: execution-graph-archived-state-after-restart
  description: Detects when ExecutionGraph transitions to a terminal state during
    restart sequence and fails to archive the job, leaving it as FAILED instead of
    FINISHED. Use when testing execution graph lifecycle after job completion.
  code_tags:
  - ARGUMENT_VALIDATION
  - BOUNDARY_CHECK
  - STATE_MUTATION
  - NULL_CHECK
  - CONCURRENCY
  test_pattern: STATE_TEST
  id: initial_skill_1033
- name: name-validation-whitespace-check
  description: When validating JCR node names, the validator must reject names containing
    non-space whitespace characters (tab, CR, LF, etc.). This skill teaches how to
    write tests that verify name validators correctly reject such illegal whitespace
    characters in node names.
  code_tags:
  - VALIDATION
  - BOUNDARY_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1034
- name: splitter-method-call-routes-deferred-resolution
  description: When testing Camel Splitter EIP with method call expressions across
    VM endpoints, ensure routes referencing beans are defined with proper deferred
    resolution. Tests may pass as standalone but fail in different contexts because
    method-call-to-bean splits rely on route definition ordering and context startup
    timing.
  code_tags:
  - NULL_CHECK
  - TYPE_CONVERSION
  - VALIDATION
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  test_pattern: INTERACTION_TEST
  id: initial_skill_1035
- name: file-poll-retry-body-not-null
  description: When testing file consumer polling with delete=true and retries (maxMessagesPerPoll=1),
    test that the file body is non-null even after the file has already been consumed
    in a prior poll but not yet deleted. The bug caused the body to become null on
    the third poll.
  code_tags:
  - NULL_CHECK
  - STATE_TRANSITION
  - RETRY_LOGIC
  test_pattern: STATE_TEST
  id: initial_skill_1036
- name: null-url-db-connection-span-reporting
  description: When handling database connection tracing with potentially null URLs,
    the TG should test that span reporting does not throw exceptions when the connection
    URL is null. This is critical for JDBC interceptors that create spans based on
    connection metadata.
  code_tags:
  - ARGUMENT_VALIDATION
  - NULL_CHECK
  - BOUNDARY_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1037
- name: binary-type-coercion-validation
  description: When binary property values are retrieved via Property.getBinary()
