    should return matches.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0973
- name: removed-node-state-mutation
  description: When a node builder gets removed from its parent, further state mutation
    operations like reading properties should throw an IllegalStateException. This
    skill helps write tests that verify operations on removed/invalidated builders
    correctly throw.
  code_tags:
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  - EXCEPTION_HANDLING
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0974
- name: servlet-initializer-failure-recovery
  description: When testing a ServletContainerInitializer that performs multiple side-effect
    operations (adding filters, listeners, starting initializers), the TG must test
    failure recovery paths — verifying that partial failures (e.g., initializer.start()
    throwing) do not leave the ServletContext in an inconsistent state, and that earlier
    operations like filter registration still complete.
  code_tags:
  - ORDER_DEPENDENCY
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0975
- name: token-credential-conflict-testing
  description: When testing token-based authentication where a conflict occurs (e.g.,
