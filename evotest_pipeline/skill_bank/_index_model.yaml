    - BUG_DETECTED
    - FAIL_ON_FIXED
    transition_tags: []
    keywords:
    - indexOf
    - last occurrence
    - first occurrence
    - delimiter search
    - frame terminator
    - backwards scan
    - premature truncation
  id: frame-decoder-last-delimiter-search
- name: host-class-import-awareness-for-injected-tests
  description: WHEN generating test methods that will be injected into an existing
    host test class, inspect the host class's import statements and ensure all classes
    used are either already imported, covered by wildcard imports, or added as new
    imports. Use fully qualified names for classes in different packages.
  code_tags:
  - IMPORT_AWARENESS
  - HOST_CLASS_INJECTION
  - TEST_GENERATION
  - PACKAGE_MISMATCH
