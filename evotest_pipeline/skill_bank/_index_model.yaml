  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_1052
- name: thread-context-map-filter-single-key-npe
  description: When testing a ThreadContextMapFilter configured with a single key/value
    pair (useMap=false), the filter() method directly calls value.equals(currentContextData().getValue(key))
    which throws NullPointerException if the context value is null. Tests must verify
    both matching and non-matching context values, including when the context key
    is absent entirely.
  code_tags:
  - NULL_CHECK
  - BOUNDARY_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1053
- name: ipv6-address-square-bracket-parsing
  description: When parsing IPv6 addresses with square brackets in URL strings, test
    that the brackets are properly stripped before parsing the address. This skill
