  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  - STATE_MUTATION
  test_pattern: INTERACTION_TEST
  id: initial_skill_0771
- name: circuit-breaker-half-open-state-transition
  description: When testing circuit breaker state transitions from HALF_OPEN to OPEN/CLOSED,
