  - EMPTY_BUFFER_HANDLING
  - NULL_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0759
- name: jndi-lookup-nonstring-type-safety
  description: When testing JNDI lookups that return non-String objects, ensure the
