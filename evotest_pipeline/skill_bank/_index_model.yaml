  code_tags:
  - BOUNDARY_CHECK
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0753
- name: recipient-list-parallel-aggregate-concurrency
  description: When testing recipient list or multicast processors with parallelProcessing
