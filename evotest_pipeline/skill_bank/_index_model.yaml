  - VALIDATION
  - DATETIME_PARSE_FORMAT
  - TYPE_CONVERSION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0983
- name: creator-overwrite-defensive-gate
  description: When a method overwrites internal state (like _arrayDelegateArgs, _delegateArgs,
