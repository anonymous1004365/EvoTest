  code_tags:
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1054
- name: data-supplier-cache-state-null-check
  description: When a data supplier has internal caches (like precomputed elements)
    that are lazily initialized and cleared via a reset/clear method, tests must ensure
    that calling getter methods before initialization does not produce stale or null
    values. This skill helps catch NullPointerExceptions or stale-state bugs in supplier/pool
    patterns.
  code_tags:
  - NULL_CHECK
  - STATE_TRANSITION
  - BOUNDARY_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_1055
- name: template-parameter-type-validation
  description: When validating proxy template parameters, test with multiple data
    types (not just String) to ensure type-safe validation. Helps detect bugs where
    non-String types bypass validation logic that only checks String parameters.
  code_tags:
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_1056
- name: package-mapper-url-encoding-state-reuse
  description: When building encoded URLs with query parameters, ensure internal mutable
    state used for URL construction is not shared across requests. Test that encoding
    multiple URLs correctly handles each set of parameters independently, returning
    non-null results.
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_1057
- name: abandoned-cluster-id-reuse
  description: When testing cluster node recovery where a node is disposed and restarted
    with an active-but-in-future lease record, the TG should verify that the existing
    cluster ID is reused rather than a new one being generated. Apply this skill when
    dealing with cluster node lifecycle and orphaned lease records.
  code_tags:
  - STATE_MUTATION
  - CONCURRENCY
  - RESOURCE_MANAGEMENT
  test_pattern: STATE_TEST
  id: initial_skill_1058
- name: mock-table-operations-exception-handling
  description: WHEN testing mock implementations of table operations (like MockTableOperations)
    that throw TableNotFoundException, THEN write tests that verify the exception
    is thrown for nonexistent tables. This skill helps detect missing or broken exception
    handling in mock/simulated table operations.
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  - CONCURRENCY
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1059
- name: serialization-of-transient-fields
  description: When a class stores arguments as transient fields (like Object[] argArray)
    and caches computed results in non-transient fields (like String formattedMessage),
    serialization round-trips lose transient data, causing NullPointerException or
    stale data on deserialization. Use this skill to test that serialized/deserialized
    message objects can still produce correct formatted output.
  code_tags:
  - SERIALIZATION
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_1060
- name: savepoint-rollback-state-cleanup
  description: When testing savepoint rollback logic, verify the rollback also properly
    reverts checkpoint/snapshot state in the backend (e.g., pending checkpoints map).
    Without proper cleanup, rollback leaves stale entries that can cause assertion
    failures or inconsistent state.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  - STATE_MUTATION
  - RESOURCE_MANAGEMENT
  test_pattern: STATE_TEST
  id: initial_skill_1061
- name: script-decoration-null-handling
  description: When implementing script decoration methods like preDecorateScript/postDecorateScript
    that chain to decorated listeners, test that null return values are properly handled
    and do not cause NullPointerException. The decorator must gracefully skip null
    scripts.
  code_tags:
  - AJAX_SCRIPT_DECORATION
  - NULL_CHECK
  - SCRIPT_NULL_HANDLING
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1062
- name: modified-timestamp-reset-testing
  description: When dealing with timestamp fields that are stored with coarse resolution
    (e.g., 5-second buckets) and may be reset/purged during operations like diff computation,
    test that timestamps are correctly preserved or recomputed rather than lost or
    set to zero.
  code_tags:
  - STATE_MUTATION
  - BOUNDARY_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_1063
- name: alternative-protocol-decoding-path
  description: When a protocol frame decoder has an alternative decoding path that
    fails silently (no frame decoded), tests should verify that the primary path is
    always used when valid data exists, and that exceptions from the alternative path
    are properly propagated or the frame is correctly decoded.
  code_tags:
  - ALTERNATIVE_PROTOCOL_DECODING
  - VALIDATION
  - EXCEPTION_HANDLING
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_1064
- name: object-name-validation-with-underscore
  description: When validating resource object names (e.g., cloud storage bucket names,
    blob names), validate that names with underscores are correctly accepted or rejected
    per the specification. This skill helps detect cases where underscore-containing
    names are incorrectly rejected.
  code_tags:
  - VALIDATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_1065
- name: policy-definition-and-transacted-definition-output-hierarchy
  description: When testing DSL model definitions like PolicyDefinition and TransactedDefinition
    that extend OutputDefinition, the TG should verify that child processors/outputs
    are correctly managed and propagated, especially when the same route is traversed
    multiple times (e.g., via JMX route dump or route restart). Use this skill whenever
    you see a class extending an output-capable definition and the test involves restarting
    a route, dumping a route, or otherwise re-processing the processor hierarchy.
  code_tags:
  - USER_MANAGEMENT
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  test_pattern: STATE_TEST
  id: initial_skill_1066
- name: item-queue-removal-lifecycle-validation
  description: When a RefreshingView removes and readds items during rendering, items
    that are newly created and assigned a child component may still carry a stale
    parent reference that causes onRemove to skip dequeue. The TG should test that
    onRemove is correctly called for items that are created, added to a child component,
