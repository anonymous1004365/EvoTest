  - BOUNDARY_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_0102
- name: protocol-decoder-timestamp-validation
  description: WHEN testing protocol decoders that parse timestamp fields from device
    messages, THEN use both valid timestamps and edge-case values (e.g., empty, zero,
