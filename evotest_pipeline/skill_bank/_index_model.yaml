  - STATE_MUTATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0978
- name: xml-schema-encoding-resolution
  description: When validating XML schemas that include/import other schemas with
    non-UTF-8 encodings, the resource resolver must properly propagate the encoding
