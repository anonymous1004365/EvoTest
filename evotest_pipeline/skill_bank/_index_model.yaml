  code_tags:
  - TYPE_HIERARCHY
  - CAST_CHECK
  - POLYMORPHISM
  test_pattern: STATE_TEST
  id: initial_skill_0586
- name: enum-template-parameter-validation
  description: When a builder processes template parameters that can be either String
