    of throwing NPE.
  code_tags:
  - VALIDATION
  - NULL_CHECK
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0581
- name: type-parameter-visitor-with-null-type
  description: When visiting type parameters in AST nodes, type references may be
    null for types in the root (default) package. The TG should test that visitors
