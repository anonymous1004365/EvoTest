  - NULL_CHECK
  - EQUALS_OVERRIDE
  test_pattern: STATE_TEST
  id: initial_skill_0967
- name: template-parameter-type-validation
  description: When parsing protocol parameters from a generic/typed list (e.g., Map<String,
    Object>), test that each parameter type is validated individually rather than
