  - BOUNDARY_CHECK
  - NULL_CHECK
  - VALIDATION
  test_pattern: STATE_TEST
  id: initial_skill_0735
- name: lazy-facade-type-description-delegation
  description: When a TypePool.LazyFacade delegates type descriptions to another TypePool,
    tests must verify that methods like describe() and findPool() handle the delegation
    correctly, especially for anonymous/inner types and non-enclosed types. This skill
    teaches how to test proxy delegation patterns where a proxy delegates to an underlying
    lazy pool.
  code_tags:
  - TYPE_CONVERSION
  - STATE_MUTATION
  - NULL_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_0736
- name: lazy-type-description-resolution-testing
  description: Learn how to test type description resolution in type pools when lazy
    resolution is enabled. Use this when testing TypePool.Default with LazyResolution
    to verify that non-enclosed anonymous types resolve correctly without errors.
  code_tags:
  - NULL_CHECK
  - VALIDATION
  - TYPE_CONVERSION
  - STATE_MUTATION
  - ORDER_DEPENDENCY
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0737
- name: type-vs-mixin-ambiguity-resolution
  description: When a method signature uses the same type for multiple parameters,
    and one parameter may hold values of a different concrete type at runtime via
    a generic wildcard or mixin, test each parameter's value validation independently
    with both expected and unexpected types to catch false-passing validations.
  code_tags:
  - STATE_MUTATION
  - VALIDATION
  - TYPE_CONVERSION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0738
- name: lucene-index-read-write-lock-handling
  description: When testing Lucene index operations under concurrent read/write node
    locking, verify that write locks are acquired before indexing and released after
    completion, and that read locks are not leaked across indexing sessions. Use interleaved
    add/delete operations to trigger inconsistent lock states.
  code_tags:
  - CONCURRENCY
  test_pattern: STATE_TEST
  id: initial_skill_0739
- name: protocol-decoder-subclass-variants
  description: When testing protocol decoders that use alternative or conditional
    decoding paths for different frame types, test each distinct codec variant (subclass
    or alternative path) to ensure they all handle the same input correctly. The bug
    involves a decoder having an alternative frame decoder that processes data differently
    than the primary path, and the test only exercises one path.
  code_tags:
  - ARGUMENT_VALIDATION
  - NULL_CHECK
  - VALIDATION
  - TYPE_CONVERSION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0740
- name: stream-cache-reset-on-exchange-copy
  description: WHEN an exchange is copied for multi-step routing (e.g. RoutingSlip,
    Pipeline, RecipientList), stream caches on the body must be reset after the copy
    so each downstream consumer re-reads from the beginning. This skill teaches how
    to test for stream cache exhaustion when copying exchanges.
  code_tags:
  - STATE_MUTATION
  - RESOURCE_MANAGEMENT
  test_pattern: STATE_TEST
  id: initial_skill_0741
- name: bytebuffer-context-position-preservation
  description: When constructing a Reader/wrapper from a ByteBuffer, the TG must test
    that the buffer's position and limit remain unchanged after construction. This
    skill helps detect bugs where the constructor modifies the ByteBuffer's state
    (e.g. flipping or resetting it), corrupting subsequent reads from the original
    buffer.
  code_tags:
  - BUFFER_OFFSET_HANDLING
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0742
- name: fqdn-hostname-extraction-validation
  description: When extracting a hostname from a fully qualified domain name (FQDN)
