    queries.
  code_tags:
  - EXCEPTION_HANDLING
  - VALIDATION
  - NULL_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_0876
- name: ordered-index-multivalue-rejection
  description: When an ordered Lucene index definition has a property with multiple
    values, the indexer must not throw an exception. Use this skill to test that ordered
    properties reject multi-valued content gracefully.
  code_tags:
  - VALIDATION
  - STATE_MUTATION
  - BOUNDARY_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0877
- name: javascript-stripper-comment-downlevel-mode
  description: Tests for JavaScript comment stripper that must not strip //-style
    line comments occurring inside string literals, especially when running in "downlevel"
    mode where partial HTML-like tags (<) inside scripts trigger state transitions.
    Use this skill when testing JS minification or comment removal logic.
  code_tags:
  - JAVASCRIPT_STRIPPING_COMMENT_HANDLING
  - STATE_MUTATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0878
- name: property-removal-via-null-setproperty
  description: When testing JCR Node.setProperty() with null value to remove a property,
    the test should verify that setting a property to null (type-cast) removes the
    property instead of throwing an exception, especially for non-existent properties.
  code_tags:
  - ARGUMENT_VALIDATION
  - BOUNDARY_CHECK
  - NULL_CHECK
  test_pattern: EXCEPTION_TEST
  id: initial_skill_0879
- name: url-parsing-is-full-hint
  description: When parsing URLs that may be absolute (protocol-less with "//" or
    scheme-based), always test with the `isFullHint` parameter set to `false` to verify
    that the URL is parsed as a relative/context-absolute URL rather than extracting
    host/protocol.
  code_tags:
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  - NULL_CHECK
  - ABSOLUTE_URL_RENDERING
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0880
- name: ajax-timer-behavior-script-rendering
  description: When testing Ajax timer behaviors, verify that the behavior correctly
    contributes its JavaScript to the Ajax response during an Ajax update. This skill
    helps detect bugs where a behavior's lifecycle events (onComponentTag, onAdded,
    etc.) fail to register the necessary JavaScript for proper Ajax rendering.
  code_tags:
  - ARGUMENT_VALIDATION
  - STATE_MUTATION
  - BEHAVIOR_LISTENER_INDEX_SHIFT
  - AJAX_TIMER_BEHAVIOR_ATTACHMENT
  - AJAX_BEHAVIOR_SETUP
  test_pattern: STATE_TEST
  id: initial_skill_0881
- name: memory-node-builder-reset-state-invalidation
  description: Teaches how to test that resetting a MemoryNodeBuilder properly invalidates
    child builder cached state, preventing stale/stuck state after rebase. Applies
    when child builders cache parent state and need to be cleared on parent reset.
  code_tags:
  - STATE_MUTATION
  - NULL_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_0882
- name: compaction-map-consistency
  description: When testing state-mutating data structures like compaction maps, generate
    and verify specific keys after compaction and force the removal of individual
    records, then check that removed keys are indeed absent from the final map.
  code_tags:
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0883
- name: default-type-for-nodetype-child-paths
  description: When testing tree type classification for paths that are children of
    JCR node types definitions, the type should be DEFAULT rather than inheriting
    a parent type. Use this skill when testing TreeTypeProvider.getType() with paths
    like /jcr:system/jcr:nodeTypes/...
  code_tags:
  - HIERARCHY_TREE_TYPE_RESOLUTION
  - PATH_PREFIX_MATCHING
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0884
- name: deserialized-proxy-with-null-throwable
  description: ''
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0885
- name: xpath-to-sql2-conversion-coverage
  description: When converting XPath queries to SQL-2 format, the test must cover
    a comprehensive set of XPath syntax variants including edge cases like multiple
    predicates, namespace wildcards, and complex path expressions, not just simple
    queries. Use the test resource file pattern to ensure all conversion paths are
    exercised.
  code_tags:
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0886
- name: async-index-checkpoint-cleanup
  description: When testing async index update lifecycle, verify that checkpoints
    are properly released/reclaimed even when no index changes occur. The TG should
    test that the `closeAndWait()` or lifecycle cleanup correctly releases resources
    (checkpoints) that were acquired during initialization.
  code_tags:
  - STATE_MUTATION
  - RESOURCE_MANAGEMENT
  test_pattern: STATE_TEST
  id: initial_skill_0887
- name: url-encoder-apostrophe-encoding
  description: When testing URL path encoding using UrlEncoder.PATH_INSTANCE (Apache
    Wicket), the apostrophe character (') must be percent-encoded as %27. A common
    bug is failing to encode apostrophes in path segments, which later get XML-encoded
    and break JavaScript URLs. This skill teaches how to test that all three UrlEncoder
    types (QUERY, PATH, HEADER) handle apostrophes according to their respective encoding
    rules.
  code_tags:
  - CHARACTER_ENCODING
  - VALIDATION
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_0888
- name: palette-initialize-children-before-model-use
  description: When a Palette component's children (Choices, Recorder) have their
    setChoicesModel/setSelectedModel called via Palette.initialize() and the model
    choice list is mutated after initialization, test that list mutations are properly
    propagated. Use when testing components that delegate model initialization to
    children.
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0889
- name: stateless-link-mark-children-immutable
  description: When a component is marked as stateless (setStatelessHint(true)), its
    children's render preparation state may be cleared. Test that components with
    dynamic links can still render properly after being marked stateless.
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  - VALIDATION
  - COMPONENT_RENDER_PREPARATION
  test_pattern: STATE_TEST
  id: initial_skill_0890
- name: cache-consistency-after-gc
  description: When testing document store garbage collection, the TG should verify
    that in-memory caches remain consistent with the underlying store. The bug is
    that VersionGarbageCollector can leave null/inconsistent entries in the document
    cache, causing NullPointerException when reading documents after GC.
  code_tags:
  - NULL_CHECK
  - STATE_MUTATION
  - CONCURRENCY
  test_pattern: STATE_TEST
  id: initial_skill_0891
- name: dependency-filter-mutation-immutability
  description: WHEN converting Maven Dependencies to Artifacts using createArtifacts(),
    THEN verify that the dependency filter (ArtifactFilter) is not mutated or shared
    across artifacts. This skill helps catch bugs where the inherited filter is wrapped
    (e.g. using AndArtifactFilter) and the mutation leaks state between unrelated
    dependency artifacts.
  code_tags:
  - STATE_MUTATION
  - NULL_CHECK
  test_pattern: STATE_TEST
  id: initial_skill_0892
- name: node-get-nodes-size-consistency
  description: When a Node.getNodes() method iterates over child nodes, the returned
    iterator's size and the actual iteration count must match. This skill catches
    bugs where an internal counter (e.g., a read position) is corrupted by failed
    operations, causing hasNext() to return false prematurely while size() still reports
    a positive count.
  code_tags:
  - RESOURCE_MANAGEMENT
  - BOUNDARY_CHECK
  - NULL_CHECK
  - STATE_MUTATION
  test_pattern: STATE_TEST
  id: initial_skill_0893
- name: custom-nodetype-registration-validation
  description: When registering custom node types via ReadWriteNodeTypeManager, validate
    that property definition templates with TYPE_UNDEFINED are properly handled (e.g.,
    by setting explicit PropertyType values) to avoid incomplete or non-functional
    type definitions after registration or upgrade.
  code_tags:
