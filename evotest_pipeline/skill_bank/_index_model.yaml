  - NULL_CHECK
  - VALIDATION
  - BOUNDARY_CHECK
  test_pattern: PARAMETRIC_TEST
  id: initial_skill_1047
- name: null-argument-validation-for-slf4j-marker-bridge
  description: When implementing SLF4J Marker bridge methods (add, contains, remove),
